on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"
jobs:
  first-workflow-job:
    name: First Workflow Job
    runs-on: ubuntu-latest
    steps:
      - name: Check out my code
        uses: actions/checkout@v6.0.2
      - name: Print hello world from My Vs Code 
        run: echo "Hello world from GitHub Actions"
      - name: Install Node.js
        run: npm install
      - name: Run tests
        run: npm test